<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f172a; color:#fff; font-family:'Segoe UI',Tahoma,sans-serif;
       display:flex; flex-direction:column; align-items:center; justify-content:center;
       height:100vh; gap:20px; }
.icon { font-size:64px; }
h1 { font-size:28px; font-weight:700; }
p { font-size:15px; color:#94a3b8; }
.bar { width:260px; height:6px; background:#1e293b; border-radius:3px; overflow:hidden; margin-top:8px; }
.fill { height:100%; background:#4f46e5; border-radius:3px; animation:load 1.8s ease-in-out infinite; }
@keyframes load { 0%{width:5%} 60%{width:80%} 100%{width:95%} }
</style>
</head>
<body>
<div class="icon">🍽️</div>
<h1>Restaurant POS</h1>
<p>กำลังเริ่มระบบ กรุณารอสักครู่...</p>
<div class="bar"><div class="fill"></div></div>
</body>
</html>
